[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ville-emergente"
version = "0.1.0"
description = "Simulation d'agents sur une carte réelle"
requires-python = ">=3.11"
dependencies = ["networkx>=3.2"]

[project.optional-dependencies]
carte = ["osmnx>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ville*"]

[tool.setuptools.package-data]
ville = ["cartes/*.json"]

[tool.pytest.ini_options]
testpaths = ["ville/tests"]
addopts = "-m 'not reseau and not ollama'"
markers = [
    "reseau: nécessite un accès au réseau",
    "ollama: nécessite un serveur Ollama local",
]
